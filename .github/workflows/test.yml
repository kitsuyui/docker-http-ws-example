name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Run tests
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Build Docker image
        run: docker build --tag docker-http-ws-example:ci .

      - name: Start container
        run: |
          container_id="$(
            docker run \
              --detach \
              --publish 127.0.0.1::8000 \
              docker-http-ws-example:ci
          )"
          port="$(docker port "$container_id" 8000/tcp | awk -F: '{print $NF}')"
          echo "CONTAINER_ID=$container_id" >> "$GITHUB_ENV"
          echo "SMOKE_URL=http://127.0.0.1:$port/" >> "$GITHUB_ENV"

      - name: Smoke test container
        run: |
          for _ in $(seq 1 30); do
            body="$(curl --fail --silent "$SMOKE_URL" || true)"
            if printf '%s' "$body" | grep --quiet '<!DOCTYPE html>'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$CONTAINER_ID"
          exit 1

      - name: Stop container
        if: always()
        run: |
          if [ -n "${CONTAINER_ID:-}" ]; then
            docker rm --force "$CONTAINER_ID"
          fi
